amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    transform_tolerance: 1.0
    # Particle filter
    max_particles: 2000
    min_particles: 500
    update_min_d: 0.1
    update_min_a: 0.2
    resample_interval: 1
    laser_model_type: likelihood_field
    laser_max_range: 16.0
    laser_min_range: 0.15
    max_beams: 60
    set_initial_pose: false
    # initial_pose_x: 0.335  # H5 fix
    # initial_pose_y: -0.325  # H5 fix
    # initial_pose_yaw: 0.750  # H5 fix

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # Increase BT action server timeouts for low-powered hardware.
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 5

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Generous tolerances for first-goal validation. Tighten in a
      # follow-up session once we know the system navigates at all.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      publish_evaluation: false
      publish_trajectories: false
      # Motor envelope empirically characterized 2026-04-22: robot
      # moves reliably down to 0.005 m/s linear and 0.05 rad/s angular
      # (~85 % ratio above 0.02 m/s / 0.15 rad/s). So the MOTOR has
      # effectively no deadband.
      #
      # First tuning pass set min_vel_x=0.02 AND min_speed_xy=0.02;
      # that starved DWB's trajectory sampler because pure-rotation
      # trajectories (vx=0) were rejected and vx=0 is needed when
      # the robot is at the goal XY but still rotating. Resulted in
      # "Could not find a legal trajectory: No valid trajectories
      # out of 0!" and the BT falling back to spin recoveries.
      #
      # Revised: let DWB sample vx=0 (min_vel_x=0.0, no min_speed_xy);
      # keep min_speed_theta=0.15 so rotation commands land above the
      # motor's reliable floor when DWB chooses rotation.
      max_vel_x: 0.15
      min_vel_x: 0.0
      max_vel_theta: 0.8
      min_speed_theta: 0.15
      acc_lim_x: 0.5
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_theta: -1.0
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 10
      sim_time: 1.5
      discretize_by_time: true
      transform_tolerance: 1.0
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 16.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 8.0
      RotateToGoal.slop: 0.05

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.10, 0.10], [0.10, -0.10], [-0.03, -0.10], [-0.03, 0.10]]"
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      footprint: "[[0.10, 0.10], [0.10, -0.10], [-0.03, -0.10], [-0.03, 0.10]]"
      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3
      transform_tolerance: 1.0
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 0.8]
    min_velocity: [-0.15, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    # Deadband sits BELOW DWB's min commands so the smoother never
    # zeroes out a valid controller output. Per 2026-04-22 motor
    # characterization, deadband ~50% of DWB min is safe.
    deadband_velocity: [0.01, 0.0, 0.075]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      max_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan

smoother_server:
  ros__parameters:
    use_sim_time: false


waypoint_follower:
  ros__parameters:
    use_sim_time: false


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 10.0
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor

docking_server:
  ros__parameters:
    use_sim_time: false
    dock_plugins: ["nav2_dock"]
    nav2_dock:
      plugin: "opennav_docking::SimpleChargingDock"
